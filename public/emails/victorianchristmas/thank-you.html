<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Thank you · Victorian Christmas Celebration at Kildrummy Manor</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Zilla+Slab:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #050b3a; color: #c5a868; font-family: 'Zilla Slab', Georgia, serif; font-size: 17px; line-height: 1.6; }
  .card { max-width: 600px; margin: 24px auto; }
  .card img { display: block; width: 100%; height: auto; }
  .panel { background: #0a1150 url('images/body-bg.jpg') center top / 100% 100% no-repeat; padding: 36px 13.5% 56px; text-align: center; }
  h1 { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-size: 18px; letter-spacing: 1px; margin: 0 0 14px; }
  p { margin: 0 0 12px; }
  .panel .title { display:block; width:100%; max-width:420px; height:auto; margin:0 auto 20px; }
  .panel { padding-top:0 !important; }
</style>
</head>
<body>
  <main class="card">
    <img src="images/header.jpg" width="600" height="273" alt="Victorian Christmas Celebration at Kildrummy Manor">
    <div class="panel">
      <img class="title" src="images/title.png" width="420" height="255" alt="You are warmly invited to a Victorian Christmas Celebration at Kildrummy Manor">
      <h1>THANK YOU</h1>
      <p>Your RSVP has been received.</p>
      <p>Amanda or Fiona will be in touch with further details of the evening.</p>
    </div>
    <img src="images/footer.jpg" width="600" height="79" alt="">
  </main>
</body>
</html>
